<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duelo de Runas</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/mazo.js" defer></script>
  <script src="js/juego.js" defer></script>
</head>
<body>
  <header class="cabecera">
    <h1>⚔️ Duelo de Runas</h1>
    <p class="reglas">
      🔥 Fuego quema 🌿 Planta · 🌿 Planta absorbe 💧 Agua · 💧 Agua apaga 🔥 Fuego
    </p>
  </header>

  <section id="pantalla-inicio" class="panel">
    <form id="form-inicio" class="form-inicio">
      <label for="nombre">Tu nombre de invocador</label>
      <input id="nombre" type="text" maxlength="20" placeholder="Ej: Morgana" required>

      <label for="dificultad">Rival</label>
      <select id="dificultad">
        <option value="aprendiz">Aprendiz (juega al azar)</option>
        <option value="archimago">Archimago (lee tu mano)</option>
      </select>

      <button type="submit" class="boton">Empezar duelo</button>
    </form>
    <p id="historial" class="historial"></p>
  </section>

  <main id="tablero" class="tablero" hidden>
    <section class="marcador">
      <p class="marcador-lado">
        <span id="nombre-jugador"></span>
        <strong id="puntos-jugador">0</strong>
      </p>
      <p class="marcador-centro">
        <span id="ronda">Ronda 1</span>
        <small id="cartas-mazo"></small>
      </p>
      <p class="marcador-lado">
        <strong id="puntos-rival">0</strong>
        <span id="nombre-rival"></span>
      </p>
    </section>

    <section class="zona">
      <h2>Mano del rival</h2>
      <div id="mano-rival" class="mano"></div>
    </section>

    <section class="arena">
      <div id="slot-jugador" class="slot"></div>
      <p id="resultado-ronda" class="resultado" aria-live="polite">Elige una carta para empezar</p>
      <div id="slot-rival" class="slot"></div>
    </section>

    <section class="zona">
      <h2>Tu mano <small>(clic o teclas 1-5)</small></h2>
      <div id="mano-jugador" class="mano"></div>
    </section>

    <aside class="cronica">
      <h2>Crónica del duelo</h2>
      <ol id="cronica" class="cronica-lista" reversed></ol>
    </aside>
  </main>

  <dialog id="fin-partida" class="dialogo">
    <h2 id="titulo-fin"></h2>
    <p id="texto-fin"></p>
    <div class="dialogo-botones">
      <button id="boton-revancha" type="button" class="boton">Revancha</button>
      <button id="boton-salir" type="button" class="boton boton-secundario">Cambiar invocador</button>
    </div>
  </dialog>

  <template id="plantilla-carta">
    <div class="carta">
      <span class="carta-poder"></span>
      <span class="carta-icono"></span>
      <span class="carta-nombre"></span>
    </div>
  </template>
</body>
</html>
